<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 170" width="540" height="170">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="fullLogoBg2" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0F121C" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>

    <!-- Border Gradient: Cyan to Pink -->
    <linearGradient id="tbBorderGradFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="50%" stop-color="#00D2C4" />
      <stop offset="100%" stop-color="#FE2C55" />
    </linearGradient>

    <!-- Bolt Gradient: Amber to Orange -->
    <linearGradient id="tbBoltGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="45%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <!-- PRO Badge Gradient -->
    <linearGradient id="tbBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF004F" />
      <stop offset="100%" stop-color="#FE2C55" />
    </linearGradient>

    <filter id="tbGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      .brand-title { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 900; letter-spacing: -0.02em; }
      .badge-text { font-family: 'Outfit', sans-serif; font-weight: 900; }
      .sub-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="540" height="170" rx="28" fill="url(#fullLogoBg2)" />
  <rect width="538" height="168" x="1" y="1" rx="27" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- 1. SQUIRCLE ICON ON LEFT -->
  <g transform="translate(35, 35)">
    <rect width="100" height="100" rx="28" fill="#0B0F19" stroke="url(#tbBorderGradFull)" stroke-width="4.5" />
    <path
      d="M53 22L36 49H49L45 74L64 43H50L53 22Z"
      fill="url(#tbBoltGradFull)"
      filter="url(#tbGlowFull)"
    />
  </g>

  <!-- 2. BRAND TYPOGRAPHY -->
  <!-- TIKBLOX -->
  <text x="160" y="94" fill="#FFFFFF" font-size="58" class="brand-title">TIKBLOX</text>

  <!-- PRO BADGE -->
  <rect x="425" y="55" width="76" height="42" rx="12" fill="url(#tbBadgeGrad)" />
  <text x="463" y="84" fill="#FFFFFF" font-size="22" text-anchor="middle" dominant-baseline="middle" class="badge-text">PRO</text>

  <!-- SUBTITLE -->
  <text x="162" y="125" fill="#8B9BB4" font-size="14" class="sub-text">TIKTOK SHOP BRASIL RADAR</text>
</svg>
