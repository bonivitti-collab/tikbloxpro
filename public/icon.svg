<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Border Gradient: Cyan to Pink (TikTok Signature) -->
    <linearGradient id="tbBorderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="50%" stop-color="#00D2C4" />
      <stop offset="100%" stop-color="#FE2C55" />
    </linearGradient>

    <!-- Bolt Gradient: Bright Amber to Energetic Orange -->
    <linearGradient id="tbBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="45%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <filter id="tbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Squircle Background with Gradient Border -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#0B0F19" stroke="url(#tbBorderGrad)" stroke-width="4" />

  <!-- Center Lightning Bolt -->
  <path
    d="M53 22L36 49H49L45 74L64 43H50L53 22Z"
    fill="url(#tbBoltGrad)"
    filter="url(#tbGlow)"
  />
</svg>
