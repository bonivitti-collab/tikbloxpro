<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Radar Pessoal da Mari - Bot TikTok & Oportunidades Virais</title>
    <meta name="description" content="Radar pessoal de tendências do TikTok e bot automático para envio de oportunidades no Telegram com roteiro UGC, fornecedores e links." />
    
    <!-- PWA meta tags -->
    <meta name="theme-color" content="#010101" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TIKBLOX" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=4" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:site_name" content="TIKBLOX" />
    <meta property="og:title" content="TIKBLOX - Radar de Tendências Virais" />
    <meta property="og:description" content="Escaneie produtos virais dos EUA e China antes de estourarem no Brasil. Descubra margens, fornecedores e surfe a onda." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tikblox.com.br/" />
    <meta property="og:image" content="/pwa-512x512.png?v=4" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TIKBLOX - Radar de Tendências" />
    <meta name="twitter:description" content="Identificador de tendências de produtos internacionais para o Brasil." />
    <meta name="twitter:image" content="/pwa-512x512.png?v=4" />
    <link rel="canonical" href="https://tikblox.com.br/" />
    <meta name="keywords" content="radar de produtos, produtos virais tiktok, dropshipping brasil, mineração de produtos, arbitragem internacional, e-commerce brasil, tendências de vendas" />

    <!-- Schema.org WebApplication Structured Data -->
    <script id="tikblox-dynamic-schema" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TIKBLOX",
      "url": "https://tikblox.com.br/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "Radar de tendências globais e produtos virais do exterior chegando ao Brasil para surfar ondas de vendas no e-commerce e dropshipping.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "BRL"
      }
    }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit (Non-blocking asynchronous load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
    </noscript>
  </head>
  <body class="bg-[#010101] text-white antialiased selection:bg-[#FE2C55] selection:text-white">
    <div id="root">
      <div style="min-height:100vh;background-color:#010101;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#ffffff;padding:24px;text-align:center;">
        <div style="position:relative;width:64px;height:64px;margin-bottom:20px;">
          <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#FE2C55,#25F4EE);display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(254,44,85,0.45);">
            <span style="font-size:28px;font-weight:900;color:#000;">⚡</span>
          </div>
        </div>
        <h2 style="font-size:20px;font-weight:900;letter-spacing:1px;margin:0 0 8px 0;background:linear-gradient(to right,#FE2C55,#25F4EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">TIKBLOX RADAR</h2>
        <p style="font-size:13px;color:#9ca3af;margin:0 0 16px 0;max-width:280px;">Iniciando radar de tendências e produtos virais...</p>
        <div style="width:160px;height:3px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;position:relative;">
          <div style="width:50%;height:100%;background:linear-gradient(90deg,#FE2C55,#25F4EE);border-radius:99px;animation:tbPulse 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes tbPulse {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
